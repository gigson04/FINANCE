<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <title>Sign In | Finance</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- CSS-only theme controls -->
    <input
        type="radio"
        name="theme"
        id="theme-light"
        class="theme-radio"
        checked
    >

    <input
        type="radio"
        name="theme"
        id="theme-dark"
        class="theme-radio"
    >

    <div class="site login-site">

        <header class="login-header">

            <a href="index.html" class="login-brand">
                <strong>finance</strong>
                <small>ONLINE BANKING</small>
            </a>

            <div class="theme-controls">
                <label for="theme-light" class="theme-button light-button">
                    light
                </label>

                <label for="theme-dark" class="theme-button dark-button">
                    dark
                </label>
            </div>

        </header>

        <main class="login-main">

            <a href="index.html" class="back-link">
                ← Back to home
            </a>

            <section class="login-box">

                <p class="label">ACCOUNT ACCESS</p>

                <h1>Welcome back.</h1>

                <p class="login-description">
                    Sign in to access your account and manage your finances.
                </p>

                <form action="login.php" method="POST">

                    <div class="form-group">
                        <label for="email">Email address</label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-button">
                        Sign in <span>↗</span>
                    </button>

                </form>

                <p class="login-note">
                    Your finances. One simple place.
                </p>

            </section>

        </main>

        <footer class="login-footer">
            <span>© 2026 FINANCE</span>
            <span>ONLINE BANKING</span>
        </footer>

    </div>

</body>
</html>
